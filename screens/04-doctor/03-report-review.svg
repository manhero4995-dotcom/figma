<g id="Report-page" data-name="Report page">
<rect x="288" y="160" width="760" height="760" rx="12" fill="#FFFFFF" stroke="#E7EBF2" stroke-width="1"/>
<text font-family="Inter, sans-serif" font-size="12" font-weight="900" fill="#286CB5" text-anchor="start" letter-spacing="1.4"><tspan x="320" y="193.6">SPARK</tspan></text>
<text font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#241A1F" text-anchor="start"><tspan x="320" y="220">Assessment report</tspan></text>
<text font-family="Inter, sans-serif" font-size="9" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="320" y="239.2">Educational insights, not a clinical diagnosis.</tspan></text>
<rect x="320" y="256" width="696" height="1" rx="0" fill="#E7EBF2"/>
<text font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#6B7280" text-anchor="start"><tspan x="320" y="277.2">Child: Salma Ahmed</tspan></text>
<text font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#6B7280" text-anchor="start"><tspan x="500" y="277.2">Date: 12 Nov 2026</tspan></text>
<text font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#6B7280" text-anchor="start"><tspan x="680" y="277.2">Reviewer: Dr. Hana Saleh</tspan></text>
<text font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#241A1F" text-anchor="start"><tspan x="320" y="316.4">Summary</tspan></text>
<text font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#4A3B42" text-anchor="start"><tspan x="320" y="338">Salma completed the SPARK IQ assessment with a score of 112,</tspan></text>
<text font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#4A3B42" text-anchor="start"><tspan x="320" y="356">placing her above the expected range for her age.</tspan></text>
<text font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#241A1F" text-anchor="start"><tspan x="320" y="396.4">Strengths</tspan></text>
<text font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#4A3B42" text-anchor="start"><tspan x="320" y="418">• Strong pattern recognition and logical reasoning.</tspan></text>
<text font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#4A3B42" text-anchor="start"><tspan x="320" y="436">• Sustained focus across the first 18 items.</tspan></text>
<text font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#4A3B42" text-anchor="start"><tspan x="320" y="454">• Confident approach to unfamiliar shapes.</tspan></text>
<text font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#241A1F" text-anchor="start"><tspan x="320" y="496.4">Areas to support</tspan></text>
<text font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#4A3B42" text-anchor="start"><tspan x="320" y="518">• Working memory when two rules are combined.</tspan></text>
<text font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#4A3B42" text-anchor="start"><tspan x="320" y="536">• Re-checking answers before submitting.</tspan></text>
<text font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#241A1F" text-anchor="start"><tspan x="320" y="596.4">Recommendations</tspan></text>
<text font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#4A3B42" text-anchor="start"><tspan x="320" y="618">• 10 minutes of Memory Match, three times a week.</tspan></text>
<text font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#4A3B42" text-anchor="start"><tspan x="320" y="636">• Short focus breaks after 12 minutes of work.</tspan></text>
<text font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#241A1F" text-anchor="start"><tspan x="320" y="696.4">Next review</tspan></text>
<text font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#4A3B42" text-anchor="start"><tspan x="320" y="718">Review progress in four weeks and compare with the</tspan></text>
<text font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#4A3B42" text-anchor="start"><tspan x="320" y="736">next form of the assessment.</tspan></text>
<rect x="320" y="852" width="240" height="1" rx="0" fill="#E7EBF2"/>
<text font-family="Inter, sans-serif" font-size="8.5" font-weight="500" fill="#6B7280" text-anchor="start"><tspan x="320" y="866.8">Dr. Hana Saleh · Educational specialist</tspan></text>
<text font-family="Inter, sans-serif" font-size="8.5" font-weight="500" fill="#6B7280" text-anchor="end"><tspan x="1016" y="866.8">Page 1 / 2</tspan></text>
