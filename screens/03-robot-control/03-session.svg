<text font-family="Inter, sans-serif" font-size="8.5" font-weight="500" fill="#2DC197" text-anchor="start"><tspan x="470" y="220.8">OK · spoken</tspan></text>
<rect x="40" y="240" width="700" height="1" rx="0" fill="#1A2940"/>
<text font-family="Inter, sans-serif" font-size="8.5" font-weight="500" fill="#8FA3BF" text-anchor="start"><tspan x="40" y="260.8">14:30:40</tspan></text>
<text font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#E8F1FF" text-anchor="start"><tspan x="112" y="261.6">/move forward 20</tspan></text>
<text font-family="Inter, sans-serif" font-size="8.5" font-weight="500" fill="#2DC197" text-anchor="start"><tspan x="470" y="260.8">OK · 0.2 m</tspan></text>
<rect x="40" y="280" width="700" height="1" rx="0" fill="#1A2940"/>
<text font-family="Inter, sans-serif" font-size="8.5" font-weight="500" fill="#8FA3BF" text-anchor="start"><tspan x="40" y="300.8">14:29:12</tspan></text>
<text font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#E8F1FF" text-anchor="start"><tspan x="112" y="301.6">/lights green</tspan></text>
